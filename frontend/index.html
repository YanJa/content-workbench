<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, view-fit=cover" />
    <meta name="theme-color" content="#101014" />
    <title>内容运营工作台</title>
    <script>
      // 挂载前同步设置 data-theme，避免刷新时主题闪一下。
      // 与 stores/theme.ts 的读取逻辑保持一致（system = 跟随系统偏好）。
      ;(function () {
        try {
          var saved = localStorage.getItem('cwb_theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <style>
      /* ICP 备案号页脚。
         工信部要求经营性/非经营性网站在页面底部展示备案号并链回 beian.miit.gov.cn，
         不挂属于「未按要求标明备案号」，抽查会通知整改。
         固定定位不占文档流，避免影响各页面既有布局；文字压低透明度，不抢内容。
         备案号内容不写死在这里：由 VITE_ICP_BEIAN 注入，缺省为空则整个页脚不显示。 */
      .icp-foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 6px;
        z-index: 60;
        text-align: center;
        font: 12px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: rgba(255, 255, 255, 0.42);
        letter-spacing: 0.2px;
        pointer-events: none; /* 不挡内容点击，只有链接本身可点 */
      }
      .icp-foot[hidden] {
        display: none;
      }
      .icp-foot a {
        color: inherit;
        text-decoration: none;
        pointer-events: auto;
      }
      .icp-foot a:hover {
        color: rgba(255, 255, 255, 0.62);
      }
      [data-theme='light'] .icp-foot {
        color: rgba(0, 0, 0, 0.40);
      }
      [data-theme='light'] .icp-foot a:hover {
        color: rgba(0, 0, 0, 0.62);
      }
      @supports (padding: env(safe-area-inset-bottom)) {
        .icp-foot {
          bottom: calc(6px + env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- 备案号由构建期环境变量注入（见 src/utils/icp.ts）。
         开源仓库不含真实备案号，未配置时此节点保持 hidden、不渲染。 -->
    <footer class="icp-foot" id="icp-foot" hidden></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
