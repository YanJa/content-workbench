# 内容运营工作台 · nginx 站点配置
#
# 用法：把本文件放到 /etc/nginx/conf.d/content-workbench.conf
# 只做两件事：托管前端静态文件 + 反代 /api 到后端
#
# 静态文件路径按实际情况改 root。

server {
    listen 80;
    server_name _;                       # 有域名就换成你的域名

    # 前端构建产物目录
    root /opt/content-workbench/frontend/dist;
    index index.html;

    client_max_body_size 60m;            # 要传 PPT / 素材，别用默认 1m

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history 模式：找不到文件就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 关键配置 ----
        # 不关缓冲的话，AI 的流式回答会攒成一整段才吐给浏览器，
        # 前端就失去了「逐字显示」的效果。这一条必须有。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
