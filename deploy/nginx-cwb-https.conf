server {
    listen 80;
    listen [::]:80;
    server_name cwb.draftpaper.ltd;

    # 证书续期通道：必须放行且不重定向，否则 90 天后 certbot renew 会失败
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cwb.draftpaper.ltd;

    ssl_certificate     /etc/letsencrypt/live/cwb.draftpaper.ltd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cwb.draftpaper.ltd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传录音/PPT：nginx 默认 1MB 会直接 413（手机录音轻松超，前端表现是白屏）
    client_max_body_size 60m;

    access_log /var/log/nginx/cwb-access.log;
    error_log  /var/log/nginx/cwb-error.log;

    # 【nginx 层不再做 auth_basic】认证已由应用内用户系统接管（/login 登录页 +
    # JWT + 邀请码注册）。两层认证不只是重复 —— 它们会**互相打架**：
    # Basic Auth 与应用的 Bearer Token 抢同一个 Authorization 头，前端登录后
    # 每个 XHR 都带 `Authorization: Bearer <jwt>`，nginx 会当成没带 Basic 凭证
    # 直接回 401，登录进去也用不了。所以这里必须摘掉。
    # 暴力破解防护下沉到应用层（后端按「用户名 + 客户端 IP」双维度限流），
    # 而不是 nginx 的 limit_req —— 本架构下 cloudflared 从本机回源，
    # $remote_addr 恒为 127.0.0.1，按 IP 限流会把所有用户算成同一个。
    location / {
        proxy_pass http://127.0.0.1:18080;

        # WebSocket（Vite HMR 依赖）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出关键：必须关缓冲，否则思维链会一次性吐出
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
