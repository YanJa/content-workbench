server {
    listen 80;
    listen [::]:80;
    server_name cwb.draftpaper.ltd;

    # 证书续期通道：必须放行且不重定向，否则 90 天后 certbot renew 会失败
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cwb.draftpaper.ltd;

    ssl_certificate     /etc/letsencrypt/live/cwb.draftpaper.ltd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cwb.draftpaper.ltd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传录音/PPT：nginx 默认 1MB 会直接 413（手机录音轻松超，前端表现是白屏）
    client_max_body_size 60m;

    access_log /var/log/nginx/cwb-access.log;
    error_log  /var/log/nginx/cwb-error.log;

    location / {
        auth_basic            "Content Workbench - Authorized Only";
        auth_basic_user_file  /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:18080;

        # WebSocket（Vite HMR 依赖）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出关键：必须关缓冲，否则思维链会一次性吐出
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
