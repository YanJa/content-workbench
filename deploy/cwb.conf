; 内容运营工作台 —— 平台 supervisord 托管配置
;
; 由 deploy/install-autostart.sh 安装：
;   1) 复制到 ${IDE_EDITOR_SERVER_DIR}/supervisord-conf/cwb.conf（持久化在 /dev/vdb）
;   2) 在 ${IDE_EDITOR_SERVER_DIR}/workspace-init/init 里加一行，
;      每次容器启动时把它拷进 tmpfs 的 include 目录
;   3) 立即拷一份到 include 目录并 ctl reload 生效
;
; 注意：include 目录 ${IDE_EDITOR_SERVER_DIR}_run/supervisord-conf 是 tmpfs，
; 每次启动都会被重建，所以只写那里没用，必须靠 init 那一行把它重新拷进去。
;
; priority 取 220+：晚于平台自带服务（最高 210），确保网络/网关就绪后再起。

; 固定出口代理：让「仅微信请求」走固定公网 IP 出网，解决沙箱动态 IP 池加不完白名单。
; priority=219 —— 必须早于 cwb-backend(220)，保证后端启动时 10800 已在监听。
; 脚本自身是常驻循环，内部自动校验出口 IP 并断线重建，这里只管别让它退出。
[program:cwb-proxy]
command=/bin/bash /workspace/content-workbench-pro/deploy/proxy-guard.sh
directory=/workspace/content-workbench-pro
autostart=true
autorestart=true
startretries=10
startsecs=8
priority=219
stopsignal=SIGTERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=PATH="/usr/bin:/bin:/usr/sbin:/sbin"
stdout_logfile=/tmp/proxy-guard.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
redirect_stderr=true

[program:cwb-backend]
command=/root/.pyenv/versions/3.11.1/bin/python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/workspace/content-workbench-pro/backend
autostart=true
autorestart=true
startretries=3
startsecs=5
priority=220
stopsignal=SIGTERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=PATH="/root/.pyenv/versions/3.11.1/bin:/root/.nvm/versions/node/v22.13.1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stdout_logfile=/tmp/cwb-backend.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
redirect_stderr=true

[program:cwb-frontend]
command=/workspace/content-workbench-pro/frontend/node_modules/.bin/vite --host 0.0.0.0 --port 5173
directory=/workspace/content-workbench-pro/frontend
autostart=true
autorestart=true
startretries=3
startsecs=5
priority=221
stopsignal=SIGTERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=PATH="/root/.nvm/versions/node/v22.13.1/bin:/root/.pyenv/versions/3.11.1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stdout_logfile=/tmp/cwb-frontend.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
redirect_stderr=true

; tunnel-guard 自己是常驻循环，内部已做「本地 5173 未监听就等」的判断，
; 所以这里只需要保证它别退出：断线重连由它自己负责。
[program:cwb-tunnel]
command=/bin/bash /workspace/content-workbench-pro/deploy/tunnel-guard.sh
directory=/workspace/content-workbench-pro
autostart=true
autorestart=true
startretries=10
startsecs=5
priority=222
stopsignal=SIGTERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=PATH="/root/.nvm/versions/node/v22.13.1/bin:/usr/bin:/bin:/usr/sbin:/sbin"
stdout_logfile=/tmp/tunnel-guard.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
redirect_stderr=true

; 防休眠保活：每 5 分钟模拟浏览器访问本地服务 + 平台域名 + 自定义预览 URL。
; 平台无活动一段时间后回收沙箱，周期性出网请求尽量推迟休眠。
; priority=230 —— 最后起，等其余服务就绪后再 keep。
[program:cwb-keepalive]
command=/bin/bash /workspace/content-workbench-pro/deploy/keepalive.sh
directory=/workspace/content-workbench-pro
autostart=true
autorestart=true
startretries=10
startsecs=5
priority=230
stopsignal=SIGTERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=PATH="/usr/bin:/bin:/usr/sbin:/sbin",KEEPALIVE_INTERVAL="300"
stdout_logfile=/tmp/cwb-keepalive.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
redirect_stderr=true
